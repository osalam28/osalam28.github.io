<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta name="robots" content="noindex, nofollow" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121512" />
    <meta
      name="description"
      content="One thoughtful request. The right local people. Discover a more considered way to find event vendors in Southern California."
    />
    <title>gathered. — Good company. Beautiful occasions.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/motion@12.23.24/dist/motion.js"
    ></script>
    <style>
      :root {
        color-scheme: dark;
        --ink: #121512;
        --panel: #1b1e19;
        --panel2: #22251f;
        --ivory: #f3f0e7;
        --muted: #aaada2;
        --gold: #cfba94;
        --sage: #b7c7ac;
        --line: #ffffff20;
        --serif: "Cormorant Garamond", Georgia, serif;
        --sans: "Manrope", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 105px;
      }
      body {
        margin: 0;
        background: var(--ink);
        color: var(--ivory);
        font-family: var(--sans);
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        color: inherit;
      }
      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      ::selection {
        background: var(--gold);
        color: var(--ink);
      }
      :focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 5px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        font-weight: 400;
      }
      p {
        line-height: 1.8;
      }
      .serif {
        font-family: var(--serif);
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-weight: 600;
        line-height: 1.7;
      }
      .muted {
        color: var(--muted);
      }
      .gold {
        color: var(--gold);
      }
      .sage {
        color: var(--sage);
      }
      .small {
        font-size: 12px;
      }
      .tiny {
        font-size: 10px;
      }
      .nowrap {
        white-space: nowrap;
      }
      .line {
        border-top: 1px solid var(--line);
      }
      .shell {
        max-width: 1440px;
        margin: auto;
        padding: 0 64px;
      }
      .section {
        padding: 106px 0;
      }
      .section-title {
        font-family: var(--serif);
        font-size: clamp(38px, 4.2vw, 64px);
        line-height: 1.03;
        letter-spacing: -0.025em;
      }
      .italic {
        font-style: italic;
      }
      .icon {
        width: 18px;
        height: 18px;
        display: inline-block;
        vertical-align: middle;
        flex-shrink: 0;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .btn {
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        min-height: 48px;
        padding: 13px 22px;
        border: 1px solid transparent;
        background: var(--ivory);
        color: var(--ink);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.015em;
        transition:
          background 0.2s,
          transform 0.2s,
          border-color 0.2s;
      }
      .btn:hover {
        background: #fff;
        transform: translateY(-2px);
      }
      .btn.secondary {
        background: transparent;
        border-color: #ffffff35;
        color: var(--ivory);
      }
      .btn.secondary:hover {
        border-color: var(--gold);
        background: #ffffff06;
      }
      .btn.dark {
        background: var(--ink);
        color: var(--ivory);
      }
      .btn.compact {
        min-height: 39px;
        padding: 9px 15px;
        gap: 10px;
        font-size: 11px;
      }
      .text-link {
        display: inline-flex;
        gap: 20px;
        align-items: center;
        font-size: 12px;
        border-bottom: 1px solid #ffffff40;
        padding-bottom: 7px;
        background: none;
        transition:
          color 0.2s,
          gap 0.2s;
      }
      .text-link:hover {
        color: var(--gold);
        gap: 26px;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border: 1px solid var(--line);
        background: transparent;
        border-radius: 50%;
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      .icon-btn:hover {
        border-color: var(--gold);
        background: #ffffff09;
      }
      .badge {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        padding: 5px 9px;
        border: 1px solid var(--line);
        font-size: 10px;
        white-space: nowrap;
      }
      .badge.green {
        color: var(--sage);
        border-color: #b7c7ac35;
        background: #b7c7ac09;
      }
      .badge.gold {
        border-color: #cfba9435;
        background: #cfba9409;
      }
      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
      }
      .brand {
        font-family: var(--serif);
        font-size: 37px;
        line-height: 1;
        letter-spacing: -1.5px;
        font-weight: 500;
      }
      .brand span {
        color: var(--gold);
      }
      .skip {
        position: fixed;
        top: -80px;
        left: 16px;
        z-index: 100;
        background: var(--ivory);
        color: var(--ink);
        padding: 12px;
      }
      .skip:focus {
        top: 12px;
      }
      .nav {
        height: 84px;
        position: sticky;
        top: 0;
        z-index: 40;
        border-bottom: 1px solid var(--line);
        background: #121512dc;
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
      }
      .nav-inner {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 32px;
        font-size: 11px;
        color: #d8d8ce;
      }
      .nav-links a:hover {
        color: var(--gold);
      }
      .nav-actions {
        display: flex;
        gap: 25px;
        align-items: center;
      }
      .mobile-menu {
        display: none;
      }
      .mobile-nav {
        position: absolute;
        top: 83px;
        left: 0;
        right: 0;
        background: var(--ink);
        padding: 24px;
        border-bottom: 1px solid var(--line);
      }
      .mobile-nav a {
        display: block;
        padding: 13px 0;
      }
      .hero {
        display: grid;
        grid-template-columns: 1.02fr 1fr;
        min-height: 660px;
        border-bottom: 1px solid var(--line);
      }
      .hero-copy {
        padding: 77px 44px 46px 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        position: relative;
      }
      .hero h1 {
        font-family: var(--serif);
        font-size: clamp(64px, 6.3vw, 94px);
        line-height: 0.96;
        letter-spacing: -0.035em;
        margin: 27px 0 25px;
      }
      .hero h1 em {
        color: var(--gold);
        font-weight: 400;
      }
      .hero-description {
        max-width: 335px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.95;
        margin-bottom: 28px;
      }
      .hero-proof {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 10px;
        color: var(--muted);
        margin-top: 18px;
      }
      .hero-bottom {
        margin-top: auto;
        padding-top: 34px;
        display: flex;
        gap: 18px;
        align-items: center;
      }
      .hero-bottom .seal {
        width: 40px;
        height: 40px;
        border: 1px solid #cfba9440;
        border-radius: 50%;
        color: var(--gold);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hero-photo {
        position: relative;
        margin: 25px 0 25px 8px;
        min-width: 0;
        overflow: hidden;
      }
      .hero-photo > img {
        position: absolute;
        inset: 0;
        filter: brightness(0.77) saturate(0.67);
        object-position: 48% center;
        transition: transform 1.4s;
      }
      .hero-photo:hover > img {
        transform: scale(1.025);
      }
      .photo-tag {
        position: absolute;
        top: 25px;
        left: 25px;
        display: flex;
        align-items: center;
        gap: 7px;
        border: 1px solid #ffffff4a;
        background: #12151260;
        backdrop-filter: blur(8px);
        padding: 8px 11px;
        font-size: 9px;
        letter-spacing: 0.08em;
      }
      .hero-note {
        position: absolute;
        bottom: 30px;
        left: 28px;
        right: 28px;
        padding: 19px 22px;
        background: #f3f0e7;
        color: var(--ink);
        display: flex;
        gap: 15px;
        align-items: center;
        box-shadow: 0 10px 30px #0002;
      }
      .hero-note .mark {
        width: 35px;
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #12151230;
        border-radius: 50%;
      }
      .hero-note p {
        font-size: 11px;
        line-height: 1.65;
      }
      .hero-note strong {
        font-weight: 600;
        display: block;
        font-size: 12px;
      }
      .hero-note .icon:last-child {
        margin-left: auto;
      }
      .occasion-strip {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: center;
        padding: 27px 0;
        color: #b6b7ab;
        border-bottom: 1px solid var(--line);
      }
      .occasion-strip span:not(.eyebrow) {
        font-family: var(--serif);
        font-size: 20px;
      }
      .occasion-strip i {
        font-size: 10px;
        color: var(--gold);
      }
      .section-heading {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 35px;
        margin-bottom: 46px;
      }
      .section-heading p {
        max-width: 320px;
        color: var(--muted);
        font-size: 12px;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 42px;
      }
      .step {
        border-top: 1px solid var(--line);
        padding-top: 22px;
      }
      .step-number {
        font-family: var(--serif);
        color: var(--gold);
        font-size: 23px;
      }
      .step h3 {
        font-family: var(--serif);
        font-size: 31px;
        margin: 33px 0 12px;
      }
      .step p {
        font-size: 12px;
        max-width: 300px;
        color: var(--muted);
      }
      .category-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr;
        gap: 20px;
      }
      .category {
        position: relative;
        height: 360px;
        overflow: hidden;
        text-align: left;
        border: 0;
        background: var(--panel);
        padding: 0;
      }
      .category img {
        filter: brightness(0.68) saturate(0.65);
        transition:
          transform 0.7s,
          filter 0.7s;
      }
      .category:hover img {
        transform: scale(1.04);
        filter: brightness(0.8) saturate(0.8);
      }
      .category-label {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 45px 24px 24px;
        background: linear-gradient(transparent, #000b);
        display: flex;
        align-items: end;
        justify-content: space-between;
      }
      .category-label h3 {
        font-family: var(--serif);
        font-size: 31px;
      }
      .category-label p {
        font-size: 10px;
        color: #e0e0d6;
      }
      .category-label .icon-btn {
        border-color: #ffffff60;
      }
      .standards {
        background: #e9e5da;
        color: var(--ink);
        padding: 78px 0;
      }
      .standards .muted {
        color: #5e6359;
      }
      .standards-inner {
        display: grid;
        grid-template-columns: 1fr 1.12fr;
        gap: 80px;
      }
      .standard-row {
        display: grid;
        grid-template-columns: 30px 1fr;
        gap: 18px;
        padding: 22px 0;
        border-bottom: 1px solid #12151225;
      }
      .standard-row:first-child {
        padding-top: 0;
      }
      .standard-row h3 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 7px;
      }
      .standard-row p {
        font-size: 12px;
        color: #606459;
      }
      .standard-row .icon {
        margin-top: 2px;
      }
      .provider-story {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 80px;
        align-items: center;
      }
      .provider-story-image {
        height: 430px;
        position: relative;
      }
      .provider-story-image img {
        filter: saturate(0.5) brightness(0.8);
      }
      .provider-story-copy p {
        color: var(--muted);
        max-width: 350px;
        font-size: 13px;
        margin: 23px 0;
      }
      .faq-wrap {
        display: grid;
        grid-template-columns: 1fr 1.12fr;
        gap: 80px;
      }
      .faq {
        border-bottom: 1px solid var(--line);
      }
      .faq summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 22px 0;
        font-size: 13px;
      }
      .faq summary::-webkit-details-marker {
        display: none;
      }
      .faq summary:after {
        content: "+";
        font-size: 22px;
        font-weight: 400;
        color: var(--gold);
      }
      .faq[open] summary:after {
        content: "−";
      }
      .faq p {
        font-size: 12px;
        color: var(--muted);
        padding: 0 25px 24px 0;
      }
      .final-cta {
        text-align: center;
        padding: 95px 20px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .final-cta h2 {
        font-family: var(--serif);
        font-size: clamp(48px, 6vw, 80px);
        letter-spacing: -0.035em;
        line-height: 1.05;
        margin: 20px 0 30px;
      }
      .footer {
        padding: 34px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 25px;
      }
      .footer .brand {
        font-size: 29px;
      }
      .footer-links {
        display: flex;
        gap: 24px;
        font-size: 10px;
        color: var(--muted);
      }
      .preview-label {
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .workspace {
        max-width: 1600px;
        margin: auto;
        display: grid;
        grid-template-columns: 208px minmax(0, 1fr);
        min-height: calc(100vh - 84px);
      }
      .sidebar {
        border-right: 1px solid var(--line);
        padding: 29px 20px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        position: sticky;
        top: 84px;
        height: calc(100vh - 84px);
      }
      .sidebar-label {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: var(--muted);
        margin: 6px 12px 17px;
      }
      .side-link {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 12px;
        font-size: 11px;
        color: var(--muted);
        border: 0;
        background: transparent;
        text-align: left;
        transition:
          background 0.2s,
          color 0.2s;
        width: 100%;
      }
      .side-link.active {
        background: #cfba9410;
        color: var(--gold);
        border-left: 2px solid var(--gold);
        padding-left: 10px;
      }
      .side-link:hover {
        color: var(--ivory);
        background: #ffffff06;
      }
      .side-count {
        margin-left: auto;
        font-size: 10px;
      }
      .sidebar-bottom {
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding: 20px 10px 0;
      }
      .avatar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        background: #d3c5ad;
        color: var(--ink);
        border-radius: 50%;
        font-family: var(--serif);
        font-size: 18px;
        flex-shrink: 0;
      }
      .avatar.dark-avatar {
        background: #34392f;
        color: var(--sage);
      }
      .workspace-main {
        padding: 29px 38px 60px;
        min-width: 0;
      }
      .demo-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 30px;
      }
      .demo-bar button {
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        font-size: 10px;
        padding: 2px 0;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 30px;
      }
      .page-heading h1 {
        font-family: var(--serif);
        font-size: 49px;
        letter-spacing: -0.025em;
        line-height: 1.05;
        margin: 8px 0 9px;
      }
      .page-heading p {
        font-size: 11px;
        color: var(--muted);
      }
      .event-banner {
        height: 175px;
        position: relative;
        overflow: hidden;
        margin-bottom: 25px;
        background: var(--panel);
      }
      .event-banner > img {
        position: absolute;
        inset: 0;
        filter: brightness(0.37) saturate(0.5);
        object-position: center 56%;
      }
      .event-banner-content {
        position: relative;
        height: 100%;
        padding: 28px 31px;
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
      }
      .event-banner h2 {
        font-family: var(--serif);
        font-size: 37px;
        margin: 8px 0;
      }
      .event-meta {
        font-size: 10px;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        color: #d5d7cc;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border: 1px solid var(--line);
        margin-bottom: 34px;
      }
      .stat {
        padding: 19px 23px;
        border-right: 1px solid var(--line);
      }
      .stat:last-child {
        border: 0;
      }
      .stat-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        font-size: 10px;
        margin-bottom: 9px;
      }
      .stat strong {
        font-family: var(--serif);
        font-size: 31px;
        font-weight: 400;
        line-height: 1;
      }
      .stat small {
        font-size: 10px;
        margin-left: 8px;
        color: var(--muted);
      }
      .workspace-columns {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 255px;
        gap: 25px;
      }
      .block-heading {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: center;
        margin-bottom: 18px;
      }
      .block-heading h2 {
        font-family: var(--serif);
        font-size: 28px;
      }
      .block-heading button {
        font-size: 10px;
      }
      .tabs {
        display: flex;
        gap: 23px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 21px;
      }
      .tab {
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        padding: 12px 0;
        font-size: 11px;
        color: var(--muted);
      }
      .tab.active {
        border-color: var(--gold);
        color: var(--ivory);
      }
      .quote-card {
        border: 1px solid var(--line);
        margin-bottom: 15px;
        padding: 19px;
        transition: border-color 0.2s;
        background: #181b16;
      }
      .quote-card:hover {
        border-color: #cfba9460;
      }
      .quote-card-top {
        display: flex;
        gap: 15px;
        align-items: center;
      }
      .quote-thumb {
        width: 66px;
        height: 66px;
        flex-shrink: 0;
        overflow: hidden;
      }
      .quote-thumb img {
        filter: saturate(0.6);
      }
      .quote-name {
        font-family: var(--serif);
        font-size: 24px;
        line-height: 1.2;
      }
      .rating {
        font-size: 9px;
        color: var(--muted);
        margin-top: 7px;
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }
      .rating b {

        $("#builder-total").textContent = money(sum);
        return sum;
      }
      function unlock() {
        openModal(
          "Your next opportunity awaits.",
          `<div class="eyebrow gold" style="margin-bottom:17px">Approved provider access</div><p>One flat monthly subscription opens full matched requests, private conversations, and quoting. No booking commission.</p><div class="notice">This is a design preview. Pricing is not set and no billing occurs. You can explore subscriber access below.</div><p class="small muted">Customer and planner names, exact venue details, and inspiration remain hidden in limited previews. Existing proposals and conversations stay accessible after a subscription ends.</p>`,
          `<button class="text-link" data-action="close">Keep browsing previews</button><button class="btn" data-action="demoactivate">Explore subscriber view ${icon("arrow")}</button>`,
        );
      }
      function preferences() {
        openModal(
          "A closer match.",
          `<form id="preferences-form"><label class="field">Service radius · miles<select name="radius">${[15, 25, 50, 75].map((n) => `<option value="${n}" ${state.preferences.radius == n ? "selected" : ""}>${n} miles from Santa Barbara</option>`).join("")}</select></label><label class="field">New request emails<select name="alerts">${["Instant", "Daily digest", "Off"].map((n) => `<option ${state.preferences.alerts === n ? "selected" : ""}>${n}</option>`).join("")}</select><small>Matching notifications require an active subscription and verified email. Booking-status updates are separate.</small></label><div class="notice">Approved categories: chairs, tables, and draping. New service categories require review before matching.</div><button class="btn" type="submit">Save preferences ${icon("check")}</button></form>`,
        );
      }
      function inbox(id) {
        openModal(
          "Keep the conversation together.",
          `<p class="small muted">${id ? esc(quotes.find((q) => q.id === id)?.name || requests.find((r) => r.id === id)?.title || "Your event") : "Your event conversation"} · Demo messages</p><div class="inbox-message">${view === "vendor" ? "Ask about the details you need before quoting. Private contact details are shared after award." : "Ask about the work, the schedule, or a revised proposal. You don’t need to share contact details here."}</div><div id="message-list">${state.messages
            .filter((m) => m.thread === (id || "general"))
            .map((m) => `<div class="inbox-message mine">${esc(m.text)}</div>`)
            .join(
              "",
            )}</div><form id="message-form" data-id="${esc(id || "general")}"><label class="field" style="margin-top:20px">Your message<textarea name="message" required maxlength="2000" placeholder="What would you like to clarify?"></textarea></label><p class="tiny muted" style="margin-bottom:15px">Saved in this browser only. No messages are sent externally.</p><button class="btn" type="submit">Add demo message ${icon("arrow")}</button></form>`,
        );
      }
      function showDetails() {
        openModal(
          "Your event details.",
          `<div class="detail-list"><div class="detail-row"><span>Event</span><span>${esc(state.event.name)}</span></div><div class="detail-row"><span>Date</span><span>${dateLabel(state.event.date)}</span></div><div class="detail-row"><span>Approximate location</span><span>${esc(state.event.location)}</span></div><div class="detail-row"><span>Guests</span><span>${state.event.guests}</span></div><div class="detail-row"><span>Private overall budget</span><span>${state.event.budget ? money(state.event.budget) : "Not set"}</span></div></div><div class="notice">${state.event.private ? "Your exact location is private. Share it only with individual vendors you choose." : "Hotel / event venue details can be visible to approved, subscribed matches. Limited previews never show exact venue details."}</div><p class="small muted">Your overall budget is never shared with vendors. Only optional targets attached to relevant needs are shared.</p>`,
          `<span class="tiny muted">Design preview · local event data</span><button class="btn secondary" data-action="close">Done</button>`,
        );
      }
      document.addEventListener("click", (e) => {
        const anchor = e.target.closest('a[href^="#"]');
        if (anchor?.getAttribute("href") === "#main") {
          e.preventDefault();
          $("#main").focus();
          $("#main").scrollIntoView({ behavior: "smooth" });
          return;
        }
        if (anchor?.getAttribute("href")?.startsWith("#home/") && view === "home") {
          const section = anchor.getAttribute("href").split("/")[1];
          if (location.hash === anchor.getAttribute("href")) {
            e.preventDefault();
            document.getElementById(section)?.scrollIntoView({ behavior: "smooth" });
            $(".mobile-nav").hidden = true;
            $('[data-action="menu"]').setAttribute("aria-expanded", "false");
            return;
          }
        }
        const b = e.target.closest("[data-action]");
        if (!b) return;
        const a = b.dataset.action,
          id = b.dataset.id;
        if (a === "menu") {
          const nav = $(".mobile-nav");
          nav.hidden = !nav.hidden;
          b.setAttribute("aria-expanded", String(!nav.hidden));
          return;
        }
        if (a === "close") {
          closeModal();
          return;
        }
        if (a === "create") {
          eventForm();
          if (b.dataset.category) {
            const mapping = {
              Rentals: ["chairs", "tables"],
              Florals: ["florals"],
              Photography: ["photo"],
            };
            (mapping[b.dataset.category] || []).forEach(
              (k) => ($(`#event-form input[value="${k}"]`).checked = true),
            );
          }
          return;
        }
        if (a === "signin") {
          openModal(
            "Make yourself at home.",
            `<p class="muted small">Explore either side of gathered. These are interactive sample workspaces; no account is required.</p><div class="grid sm:grid-cols-2 gap-4" style="margin-top:25px"><a href="#customer" data-action="close" class="btn">Customer workspace ${icon("arrow")}</a><a href="#vendor" data-action="close" class="btn secondary">Provider feed ${icon("arrow")}</a></div>`,
          );
          return;
        }
        if (a === "about") {
          openModal(
            "A considered first look.",
            `<p>This single-file prototype brings together the landing page, a customer workspace, and a provider feed.</p><div class="notice">All people, events, quotes, ratings, and account states are fictional. Actions save only in this browser. Authentication, billing, live ratings, and external messaging are not connected.</div><p class="small muted">Working name: gathered.<br>Type: Cormorant Garamond + Manrope.<br>Palette: ink #121512, ivory #F3F0E7, champagne #CFBA94, sage #B7C7AC.<br>Editorial imagery: Unsplash.</p>`,
          );
          return;
        }
        if (a === "standards") {
          openModal(
            "Good work. Clear standards.",
            `<div class="detail-list">${[
              [
                "Established reputation",
                "An existing Google or Yelp listing with reviews is required. Both sources are shown when available.",
              ],
              [
                "Relevant work",
                "Portfolios and service categories are reviewed before providers can quote.",
              ],
              [
                "Complete proposals",
                "Full quantities, appropriate imagery, explicit fees, and clear terms.",
              ],
              [
                "Accountability",
                "Repeated substantiated issues lead to review, restrictions, or suspension. Providers can appeal.",
              ],
              [
                "Honest credentials",
                "License, insurance, and bond information is provider-reported unless explicitly stated otherwise. Approval is not insurance or license verification.",
              ],
            ]
              .map(
                ([t, d]) =>
                  `<div style="padding:15px 0;border-bottom:1px solid var(--line)"><h3 class="serif" style="font-size:25px;margin-bottom:8px">${t}</h3><p class="small muted">${d}</p></div>`,
              )
              .join("")}</div>`,
          );
          return;
        }
        if (a === "privacy") {
          openModal(
            "Your plans stay yours.",
            `<p>Your overall budget is private to you and authorized collaborators. Only item targets you choose to enter are shared with relevant vendors.</p><div class="notice">Limited previews never reveal your name, your planner’s name, identifying event titles, exact venue details, photos, or attachments.</div><p class="small muted">Private-home addresses require your permission to share with an individual vendor. Direct personal contact details are released after the vendor confirms an award.</p>`,
          );
          return;
        }
        if (a === "overview") {
          customerFilter = "all";
          navigate("#customer");
          return;
        }
        if (a === "customerquotes") {
          customerFilter = "all";
          render();
          $("#customer-proposals").scrollIntoView({ behavior: "smooth" });
          return;
        }
        if (a === "feed") {
          vendorTab = "feed";
          vendorFilter = "All requests";
          render();
          return;
        }
        if (a === "myquotes") {
          vendorTab = "proposals";
          render();
          return;
        }
        if (a === "saved") {
          vendorTab = "feed";
          vendorFilter = "Saved";
          render();
          return;
        }
        if (a === "cfilter") {
          customerFilter = id;
          render();
          return;
        }
        if (a === "vfilter") {
          vendorFilter = id;
          render();
          return;
        }
        if (a === "save") {
          state.saved = state.saved.includes(id)
            ? state.saved.filter((s) => s !== id)
            : [...state.saved, id];
          persist();
          let y = scrollY;
          render();
          scrollTo(0, y);
          return;
        }
        if (a === "access") {
          state.preview = id === "preview";
          persist();
          render();
          return;
        }
        if (a === "reset") {
          openModal(
            "Reset this preview?",
            `<p class="small muted">This clears locally saved demo events, messages, quotes, and preferences, and restores the original sample workspaces.</p>`,
            `<button class="btn secondary" data-action="close">Keep my changes</button><button class="btn" data-action="doreset">Reset demo</button>`,
          );
          return;
        }
        if (a === "doreset") {
          state = structuredClone(initial);
          persist();
          vendorTab = "feed";
          customerFilter = "all";
          closeModal();
          render();
          toast("The sample workspaces have been restored.");
          return;
        }
        if (a === "quote") {
          showQuote(id);
          return;
        }
        if (a === "compare") {
          compare();
          return;
        }
        if (a === "eventdetails") {
          showDetails();
          return;
        }
        if (a === "accept") {
          const q = quotes.find((q) => q.id === id);
          if (qStatus(q) !== "open" || blocked(q)) {
            toast("This proposal is no longer available for acceptance.");
            return;
          }
          state.quoteStates[id] = "pending";
          persist();
          closeModal();
          render();
          toast(
            "Proposal accepted in demo. The vendor has 48 hours to confirm.",
          );
          return;
        }
        if (a === "withdraw") {
          delete state.quoteStates[id];
          persist();
          closeModal();
          render();
          toast("Acceptance withdrawn. The needs are open again.");
          return;
        }
        if (a === "confirm") {
          openModal(
            "Confirm this award.",
            `<p>Confirm that you can supply all 120 chairs and all 10 tables for <strong>${money(quotes[0].total)}</strong>, on the quoted date and terms.</p><div class="notice">This marks the proposal awarded and releases the sample customer contact details. The contract and deposit are arranged directly.</div>`,
            `<button class="btn secondary" data-action="close">Go back</button><button class="btn" data-action="doconfirm">Confirm & mark awarded ${icon("check")}</button>`,
          );
          return;
        }
        if (a === "doconfirm") {
          if (state.quoteStates.paloma !== "pending") {
            toast("No pending acceptance to confirm.");
            return;
          }
          state.quoteStates.paloma = "awarded";
          persist();
          closeModal();
          render();
          toast("Award confirmed. The customer workspace has updated.");
          return;
        }
        if (a === "request") {
          requestDetail(id);
          return;
        }
        if (a === "buildquote") {
          quoteBuilder(id);
          return;
        }
        if (a === "unlock" || a === "billing") {
          unlock();
          return;
        }
        if (a === "preferences") {
          preferences();
          return;
        }
        if (a === "demoactivate") {
          state.preview = false;
          persist();
          closeModal();
          render();
          toast("Subscriber preview activated. No payment was taken.");
          return;
        }
        if (a === "inbox") {
          inbox(id);
          return;
        }
        if (a === "documents") {
          openModal(
            "Your booking documents.",
            `<p class="small muted">Keep contracts and supporting documents with their awarded booking.</p><div class="detail-row"><span>${icon("file")} Studio Luce · Floral brief<small>Sample document · Reference only</small></span><button class="text-link" data-action="sampledoc">View</button></div><div class="notice">Signing and payments happen directly with vendors. A file upload does not verify a signature.</div>`,
          );
          return;
        }
        if (a === "sampledoc") {
          openModal(
            "Studio Luce · Floral brief",
            `<div class="eyebrow gold" style="margin-bottom:20px">Sample booking document</div><p>12 seasonal table arrangements in ivory and muted green. Low arrangements to keep conversation flowing.</p><div class="detail-row"><span>Event</span><span>June 19, 2027</span></div><div class="detail-row"><span>Status</span><span>Awarded · sample data</span></div><p class="small muted" style="margin-top:20px">This is an illustrative creative brief, not a signed contract.</p>`,
          );
          return;
        }
        if (a === "sentquote") {
          const s = state.sent.find((s) => s.request === id),
            r = requests.find((r) => r.id === id);
          if (!s) return;
          openModal(
            "Your submitted proposal.",
            `<p class="serif" style="font-size:28px">${r.title}</p><div class="detail-list">${s.keys
              .map((k) => {
                const i = r.items.find((i) => i.key === k);
                return `<div class="detail-row"><span>${i.qty} ${i.name}</span><span>${money(s.units[k] * i.qty)}</span></div>`;
              })
              .join(
                "",
              )}<div class="detail-row"><span>Delivery / setup / tax</span><span>${money(s.delivery + s.setup + s.tax)}</span></div><div class="detail-row detail-total"><span>Total</span><span>${money(s.total)}</span></div></div><p class="small muted">${esc(s.deposit)}<br>${esc(s.terms)}<br>Expires ${dateLabel(s.expiry)}.</p><div class="notice">Saved in this demo only. No real customer received this proposal.</div>`,
          );
          return;
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "feed-sort") {
          sort = e.target.value;
          render();
        }
        if (e.target.id === "venue-type") {
          let val = e.target.value;
          $("#venue-private").checked = val === "private";
          $("#venue-notice").textContent =
            val === "private"
              ? "Your home address is private by default. You choose which individual vendors receive it."
              : val === "unknown"
                ? "A city or area is enough to begin. Vendors will state their travel and access assumptions."
                : "Hotel and venue details can be seen by matched subscribers. You can choose to keep the exact location private.";
        }
        if (e.target.classList.contains("compare-check")) {
          const selected = $$(".compare-check:checked").map((c) =>
            quotes.find((q) => q.id === c.value),
          );
          const keys = selected.flatMap((q) => q.scope),
            overlap = keys.length !== new Set(keys).size;
          $("#compare-result").innerHTML = !selected.length
            ? "Select proposals to preview combined coverage and cost."
            : overlap
              ? '<span class="gold">These proposals both include chairs and tables. Choose one rental package or request a revision. They cannot be accepted together.</span>'
              : `<div class="flex justify-between items-center gap-4"><div><span class="eyebrow gold">Your combination</span><p style="margin-top:7px">${selected.map((q) => q.name).join(" + ")}</p><p class="tiny muted">Covers ${keys.map((k) => shortNeeds[k].toLowerCase()).join(", ")}. ${
                  ["chairs", "tables", "photo"].filter((k) => !keys.includes(k))
                    .length
                    ? `Still open: ${["chairs", "tables", "photo"]
                        .filter((k) => !keys.includes(k))
                        .map((k) => shortNeeds[k].toLowerCase())
                        .join(", ")}.`
                    : "All remaining needs covered."
                }</p></div><span class="detail-total">${money(selected.reduce((n, q) => n + q.total, 0))}</span></div>`;
        }
        if (e.target.closest("#quote-form")) updateBuilder();
      });
      document.addEventListener("input", (e) => {
        if (e.target.closest("#quote-form")) updateBuilder();
      });
      document.addEventListener("submit", (e) => {
        e.preventDefault();
        let f = e.target,
          fd = new FormData(f);
        if (f.id === "event-form") {
          let ns = fd.getAll("needs");
          if (!ns.length) {
            $("#event-error").textContent =
              "Choose at least one need to continue.";
            return;
          }
          state.event = {
            name: fd.get("name").trim(),
            type: fd.get("type"),
            date: fd.get("date"),
            location: fd.get("location").trim(),
            guests: Number(fd.get("guests")),
            budget: Number(fd.get("budget")) || 0,
            needs: ns,
            private: fd.has("private"),
            venue: fd.get("venue"),
          };
          state.customEvent = true;
          state.quoteStates = {};
          persist();
          closeModal();
          navigate("#customer");
          toast("Your demo event is saved in this browser.");
          return;
        }
        if (f.id === "preferences-form") {
          state.preferences = {
            radius: fd.get("radius"),
            alerts: fd.get("alerts"),
          };
          persist();
          closeModal();
          render();
          toast("Your matching preferences have been saved locally.");
          return;
        }
        if (f.id === "message-form") {
          const message = String(fd.get("message")).trim();
          if (!message) return;
          state.messages.push({ thread: f.dataset.id, text: message });
          persist();
          const div = document.createElement("div");
          div.className = "inbox-message mine";
          div.textContent = message;
          $("#message-list").append(div);
          f.reset();
          toast("Demo message saved. Nothing was sent externally.");
          return;
        }
        if (f.id === "quote-form") {
          if (state.preview) {
            toast("A subscription is needed to submit new proposals.");
            return;
          }
          const r = requests.find((r) => r.id === f.dataset.id),
            keys = fd.getAll("quoteitem");
          if (!keys.length) {
            $("#quote-error").textContent =
              "Select at least one need to quote in full.";
            return;
          }
          if (state.sent.some((s) => s.request === r.id)) {
            toast("A proposal for this request is already saved.");
            return;
          }
          if (
            keys.some(
              (k) =>
                r.items.find((i) => i.key === k).received >=
                r.items.find((i) => i.key === k).limit,
            )
          ) {
            $("#quote-error").textContent =
              "A selected need has no quote spots left. Your draft has been preserved.";
            return;
          }
          let units = Object.fromEntries(
            keys.map((k) => [k, Number(fd.get("unit-" + k))]),
          );
          state.sent.push({
            request: r.id,
            keys,
            units,
            total: updateBuilder(),
            delivery: Number(fd.get("delivery")),
            setup: Number(fd.get("setup")),
            tax: Number(fd.get("tax")),
            deposit: fd.get("deposit"),
            terms: fd.get("terms"),
            expiry: fd.get("expiry"),
          });
          persist();
          closeModal();
          render();
          toast("Demo proposal submitted. Your quote spot is now counted.");
          return;
        }
      });
      $("#dialog").addEventListener("click", (e) => {
        if (e.target === $("#dialog")) {
          const r = e.target.getBoundingClientRect();
          if (
            e.clientX < r.left ||
            e.clientX > r.right ||
            e.clientY < r.top ||
            e.clientY > r.bottom
          )
            closeModal();
        }
      });
      window.addEventListener("hashchange", () => {
        closeModal();
        render();
        if (!location.hash.includes("/"))
          window.scrollTo({ top: 0, behavior: "instant" });
      });
      render();
      window.addEventListener("load", () => animateIn($("#main")));
    </script>
  </body>
</html>
