<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify your email for Peps</title></head>
<body style="margin:0;background:#f3f6f4;color:#23372d;font-family:Arial,sans-serif;line-height:1.6">
  <div style="max-width:480px;margin:0 auto;padding:40px 24px">
    <p style="font-size:24px;font-weight:700;color:#166550">peps.</p>
    <h1 style="font-size:24px;line-height:1.3">Welcome to Peps</h1>
    <p>Verify your email to set up your private account and start your stack.</p>
    <p style="margin:28px 0"><a href="{{ .SiteURL }}?auth=20261018-signup-v1#token_hash={{ .TokenHash }}&amp;type=email" style="background:#166550;color:#ffffff;padding:14px 22px;border-radius:6px;display:inline-block;text-decoration:none">Verify email</a></p>
    <p>If this link expires, return to <a href="{{ .SiteURL }}">Peps</a> and choose Create account to request a fresh email.</p>
    <p>If you didn't request an account, you can ignore this email.</p>
  </div>
</body></html>
